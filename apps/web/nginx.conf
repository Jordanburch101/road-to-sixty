# Serves the static build like Vercel did: /terms finds terms/index.html (or
# terms.html) without a redirect, unknown paths get the 404 page, hashed
# assets are cached for a year and pages are checked every time.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    absolute_redirect off;
    server_tokens off;
    charset utf-8;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;
    gzip_min_length 1024;

    location / {
        try_files $uri $uri/index.html $uri.html =404;
        add_header Cache-Control "public, max-age=0, must-revalidate";
    }

    # Astro's build output: file names carry a content hash.
    location /_astro/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}
