# Postgres and an S3 store for running the server and its tests locally and
# in CI. SeaweedFS stands in for R2: it speaks the same S3 API, and with no
# keys configured it accepts any. Ports are off the defaults so they don't
# clash with anything else running.
name: rts-server
services:
  postgres:
    image: postgres:17.11
    environment:
      POSTGRES_USER: rts
      POSTGRES_PASSWORD: rts
      POSTGRES_DB: rts
    ports: ["127.0.0.1:55432:5432"]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "rts"]
      interval: 2s
      retries: 30
  s3:
    image: chrislusf/seaweedfs:4.54
    command: server -s3
    ports: ["127.0.0.1:58333:8333"]
    # Ready once the S3 gateway answers, so `up --wait` (CI) waits for it:
    # without this the first test could start before it did, and timed out.
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:8333/healthz"]
      interval: 2s
      retries: 30
