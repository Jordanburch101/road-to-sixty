[package]
name = "rts-sync"
version = "0.1.0"
edition = "2024"

[dependencies]
base64 = "=0.22.1"
dirs = "7.0.0"
hex = "0.4.3"
minisign-verify = "=0.3.0"
notify = "8.2.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.11.0"
sysinfo = "0.39.6"
tiny_http = { version = "0.12.0", optional = true }
ureq = { version = "3.4.2", features = ["json"] }
zip = { version = "=4.6.1", default-features = false, features = ["deflate-flate2-zlib-rs"] }
zstd = "=0.14.0"

[dev-dependencies]
tempfile = "3.27.0"
tiny_http = "0.12.0"

[features]
# The stand-in server, for the app's tests.
fake = ["dep:tiny_http"]
