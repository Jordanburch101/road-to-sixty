[package]
name = "road-to-sixty-app"
version = "0.1.7"
edition = "2024"

[build-dependencies]
tauri-build = { version = "=2.7.2", features = [] }

[dependencies]
rts-sync = { path = "../engine" }
serde = { version = "1.0.229", features = ["derive"] }
# tauri::generate_context! names it once the config has plugin settings.
serde_json = "=1.0.151"
sysinfo = "0.39.6"
tauri = { version = "=2.12.3", features = ["tray-icon", "image-png"] }
tauri-plugin-autostart = "=2.7.0"
tauri-plugin-dialog = "=2.8.2"
tauri-plugin-opener = "=2.7.1"
tauri-plugin-positioner = { version = "=2.4.0", features = ["tray-icon"] }
tauri-plugin-process = "=2.4.0"
tauri-plugin-single-instance = "=2.5.3"
tauri-plugin-updater = "=2.13.3"

[dev-dependencies]
rts-sync = { path = "../engine", features = ["fake"] }
tempfile = "3.27.0"
