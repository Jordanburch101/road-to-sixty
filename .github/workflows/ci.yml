# On every push to main or dev and every pull request: checks, the addon's
# tests under LuaJIT and standard Lua 5.1, and a release build, uploaded as
# an artifact you can download and install to try. Also the website and the
# server. The desktop app has its own workflow (desktop-ci.yml), which runs
# only when the app or what it uses changes.
name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

# A new push to a pull request stops its older run; pushes to main and dev finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # tags, for the version from git describe

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install LuaJIT and Lua 5.1
        run: sudo apt-get update && sudo apt-get install -y luajit lua5.1

      - name: Install
        run: bun install --frozen-lockfile

      - name: Checks
        run: bun run check --filter=@road-to-sixty/addon

      - name: Tests under LuaJIT and Lua 5.1
        run: bun run test --filter=@road-to-sixty/addon

      - name: Release build
        id: package
        shell: pwsh
        working-directory: apps/addon
        run: ./scripts/package.ps1

      # The artifact is zipped by GitHub, so upload the folder: the download
      # then holds RoadToSixty/ ready to drop into Interface/AddOns.
      - uses: actions/upload-artifact@v4
        with:
          name: RoadToSixty-${{ steps.package.outputs.version }}
          path: apps/addon/build/

  # The website: its tests, then a build with stand-in settings.
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Install
        run: bun install --frozen-lockfile
      - name: Tests and types
        run: cd packages/ui && bun test && cd ../../apps/web && bun test && bun run typecheck
      - name: Build
        working-directory: apps/web
        env:
          PUBLIC_SITE_URL: https://example.test
          PUBLIC_ADDON_URL: https://example.test/addon
          PUBLIC_CONTACT_EMAIL: test@example.test
        run: bun run build

  # The sync server: its tests against Postgres and an S3 store, then the
  # image Dokploy deploys, checked to merge with Lua 5.1 inside it.
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install Lua 5.1
        run: sudo apt-get update && sudo apt-get install -y lua5.1

      - name: Install
        run: bun install --frozen-lockfile

      - name: Start Postgres and S3
        run: docker compose -f apps/server/docker-compose.yml up -d --wait

      - name: Typecheck
        run: bun run typecheck

      - name: Server tests
        working-directory: apps/server
        run: bun test

      - name: Image
        run: docker build -f apps/server/Dockerfile -t rts-server .

      - name: The image can merge
        run: >
          docker run --rm -e DATABASE_URL=unused -e S3_ENDPOINT=unused -e S3_BUCKET=unused
          -e S3_ACCESS_KEY_ID=unused -e S3_SECRET_ACCESS_KEY=unused
          -e BETTER_AUTH_URL=unused -e BETTER_AUTH_SECRET=unused -e ACCOUNT_HASH_KEY=unused
          -e BATTLENET_CLIENT_ID=unused -e BATTLENET_CLIENT_SECRET=unused
          rts-server bun apps/server/scripts/smoke.ts
