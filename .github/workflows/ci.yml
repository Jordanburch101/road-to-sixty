# On every push to main and every pull request: checks, tests, and a release
# build, uploaded as an artifact you can download and install to try.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # tags, for the version from git describe

      - name: Install LuaJIT
        run: sudo apt-get update && sudo apt-get install -y luajit

      - name: Checks and tests
        shell: pwsh
        run: ./check.ps1

      - name: Release build
        id: package
        shell: pwsh
        run: ./scripts/package.ps1

      # The artifact is zipped by GitHub, so upload the folder: the download
      # then holds ForeverMod/ ready to drop into Interface/AddOns.
      - uses: actions/upload-artifact@v4
        with:
          name: ForeverMod-${{ steps.package.outputs.version }}
          path: build/
