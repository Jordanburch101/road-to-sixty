# On every push to main or dev and every pull request: checks, the addon's
# tests under LuaJIT and standard Lua 5.1, and a release build, uploaded as
# an artifact you can download and install to try.
name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # tags, for the version from git describe

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install LuaJIT and Lua 5.1
        run: sudo apt-get update && sudo apt-get install -y luajit lua5.1

      - name: Install
        run: bun install --frozen-lockfile

      - name: Checks
        run: bun run check --filter=@road-to-sixty/addon

      - name: Tests under LuaJIT and Lua 5.1
        run: bun run test --filter=@road-to-sixty/addon

      - name: Release build
        id: package
        shell: pwsh
        working-directory: apps/addon
        run: ./scripts/package.ps1

      # The artifact is zipped by GitHub, so upload the folder: the download
      # then holds RoadToSixty/ ready to drop into Interface/AddOns.
      - uses: actions/upload-artifact@v4
        with:
          name: RoadToSixty-${{ steps.package.outputs.version }}
          path: apps/addon/build/

  # The website: its tests, then a build with stand-in settings.
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Install
        run: bun install --frozen-lockfile
      - name: Tests and types
        run: cd packages/ui && bun test && cd ../../apps/web && bun test && bun run typecheck
      - name: Build
        working-directory: apps/web
        env:
          PUBLIC_SITE_URL: https://example.test
          PUBLIC_ADDON_URL: https://example.test/addon
          PUBLIC_CONTACT_EMAIL: test@example.test
        run: bun run build

  # The sync server: its tests against Postgres and an S3 store, then the
  # image Dokploy deploys, checked to merge with Lua 5.1 inside it.
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install Lua 5.1
        run: sudo apt-get update && sudo apt-get install -y lua5.1

      - name: Install
        run: bun install --frozen-lockfile

      - name: Start Postgres and S3
        run: docker compose -f apps/server/docker-compose.yml up -d --wait

      - name: Typecheck
        run: bun run typecheck

      - name: Server tests
        working-directory: apps/server
        run: bun test

      - name: Image
        run: docker build -f apps/server/Dockerfile -t rts-server .

      - name: The image can merge
        run: >
          docker run --rm -e DATABASE_URL=unused -e S3_ENDPOINT=unused -e S3_BUCKET=unused
          -e S3_ACCESS_KEY_ID=unused -e S3_SECRET_ACCESS_KEY=unused
          -e BETTER_AUTH_URL=unused -e BETTER_AUTH_SECRET=unused -e ACCOUNT_HASH_KEY=unused
          -e BATTLENET_CLIENT_ID=unused -e BATTLENET_CLIENT_SECRET=unused
          rts-server bun apps/server/scripts/smoke.ts

  # The desktop app on Linux: every Rust test (one has LuaJIT read back the
  # sync folder it writes), clippy and formatting, then the AppImage, started
  # in a bare Arch Linux like SteamOS, and the game-start check under Wine.
  # Ubuntu 22.04, the oldest base the AppImage supports. The screenshot and
  # the AppImage are kept with the run.
  desktop-linux:
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install the build libraries, LuaJIT and Wine
        run: >
          sudo apt-get update && sudo apt-get install -y
          libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev patchelf file
          luajit wine wine64 gcc-mingw-w64-x86-64 xvfb

      - name: Install
        run: bun install --frozen-lockfile

      - name: Window
        run: bun run build

      - name: Tests
        run: cargo test --workspace

      - name: Clippy and formatting
        run: cargo clippy --workspace --all-targets -- -D warnings && cargo fmt --check

      # No signing key on pull requests, so no updater files.
      - name: AppImage
        run: bunx tauri build --bundles appimage -c '{"bundle":{"createUpdaterArtifacts":false}}'

      # From the repo root, which the container sees as /w.
      - name: It starts on a bare Arch Linux
        working-directory: .
        run: >
          docker run --rm -v "$PWD":/w archlinux bash /w/apps/desktop/scripts/linux-smoke.sh
          "/w/$(ls apps/desktop/target/release/bundle/appimage/*.AppImage | head -1)" /w/smoke

      - name: Wine
        run: cargo build --bin rts-sync && scripts/wine-check.sh target/debug/rts-sync

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux
          path: |
            smoke/
            apps/desktop/target/release/bundle/appimage/*.AppImage

  # The app on the systems it ships for: the window builds, every Rust test
  # passes (LuaJIT's is left to the Linux job).
  desktop-app:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install
        run: bun install --frozen-lockfile

      - name: Window
        working-directory: apps/desktop
        run: bun run build && bun run typecheck

      - name: Tests
        working-directory: apps/desktop
        run: cargo test --workspace -- --skip luajit_reads_the_journey_back_unchanged

      - name: Clippy
        working-directory: apps/desktop
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Script and UI tests
        run: cd apps/desktop && bun test scripts && cd ../../packages/ui && bun test
