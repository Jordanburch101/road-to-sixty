# Run by hand (Actions > CurseForge check > Run workflow) to test the
# CurseForge token and game versions without uploading anything.
name: CurseForge check

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check token and game versions
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_GAME_VERSIONS: ${{ vars.CF_GAME_VERSIONS }}
        run: bash scripts/curseforge.sh check
